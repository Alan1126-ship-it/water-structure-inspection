<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>特定水土保持區保全對象現地訪談調查系統</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+TC:wght@400;600;700&display=swap');

    :root {
      --canvas-bg: #fdfbf7;
      --canvas-card: rgba(255, 253, 249, 0.95);
      --oil-charcoal: #2c2523;
      --oil-muted: #6e645e;
      --oil-border: #e2d7c5;
      --accent-khaki: #F0E68C;
      --accent-skyblue: #87CEEB;
      --accent-plum: #DDA0DD;
      --btn-green: #437356;
      --btn-blue: #4a6c8e;
      --btn-danger: #a93226;
      --font-serif-tc: 'Noto Serif TC', 'Garamond', serif;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--canvas-bg);
      color: var(--oil-charcoal);
      font-family: var(--font-serif-tc);
      margin: 0;
      padding: 16px 12px 60px 12px;
      line-height: 1.6;
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(240, 230, 140, 0.35) 0%, transparent 40%),
        radial-gradient(circle at 90% 20%, rgba(135, 206, 235, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(221, 160, 221, 0.28) 0%, transparent 55%);
      background-attachment: fixed;
    }

    .canvas-container {
      max-width: 920px;
      margin: 0 auto;
      background: var(--canvas-card);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 14px 35px rgba(58, 44, 34, 0.12);
      border: 1px solid rgba(210, 198, 180, 0.7);
    }

    .gallery-header { text-align: center; margin-bottom: 20px; }
    .gallery-subtitle { font-size: 0.85rem; letter-spacing: 2px; color: var(--oil-muted); text-transform: uppercase; }
    .gallery-title { font-size: 1.65rem; font-weight: 700; color: #352822; margin: 4px 0 0 0; }

    .palette-nav {
      display: flex; background: rgba(230, 220, 204, 0.65); border-radius: 14px;
      padding: 5px; margin-bottom: 20px; border: 1px solid var(--oil-border);
    }
    .palette-tab-btn {
      flex: 1; background: transparent; border: none; padding: 10px 14px;
      border-radius: 10px; font-family: var(--font-serif-tc); font-size: 0.95rem;
      font-weight: 700; color: var(--oil-muted); cursor: pointer; transition: all 0.25s;
    }
    .palette-tab-btn.active {
      background: #ffffff; color: var(--oil-charcoal);
      box-shadow: 0 4px 12px rgba(60, 48, 38, 0.1); border-bottom: 3px solid var(--accent-plum);
    }

    .pastel-ribbon {
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(90deg, rgba(240, 230, 140, 0.35) 0%, rgba(135, 206, 235, 0.35) 50%, rgba(221, 160, 221, 0.35) 100%);
      padding: 10px 16px; border-radius: 12px; margin-bottom: 16px; border: 1px solid rgba(210, 198, 180, 0.6);
      flex-wrap: wrap; gap: 8px;
    }
    .btn-brush {
      background: #fff; color: #3e322b; border: 1px solid #c9bca9;
      padding: 6px 14px; border-radius: 20px; font-size: 0.86rem;
      font-family: var(--font-serif-tc); font-weight: 700; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .panel-card {
      background: #ffffff; border-radius: 16px; padding: 20px 18px; margin-bottom: 18px;
      border: 1px solid var(--oil-border); box-shadow: 0 6px 20px rgba(65, 52, 42, 0.04); position: relative;
    }
    .panel-card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 16px 16px 0 0;
      background: linear-gradient(90deg, var(--accent-khaki), var(--accent-skyblue), var(--accent-plum));
    }
    .panel-title {
      font-size: 1.12rem; font-weight: 700; color: #382c23; margin-bottom: 16px;
      display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ede4d6; padding-bottom: 8px;
    }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.92rem; color: #44372e; }
    input[type="text"], input[type="date"], input[type="password"], select, textarea {
      width: 100%; padding: 10px 14px; border: 1px solid #d7cbbb; border-radius: 8px;
      font-size: 0.95rem; font-family: var(--font-serif-tc); background: #fbf9f4;
      color: var(--oil-charcoal); outline: none; transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      background: #fff; border-color: var(--accent-plum); box-shadow: 0 0 0 3px rgba(221, 160, 221, 0.35);
    }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 220px; }

    .choice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
    .choice-item {
      display: flex; align-items: flex-start; gap: 10px; background: #faf7f2;
      padding: 10px 12px; border-radius: 10px; border: 1px solid #e7ddce; cursor: pointer; font-size: 0.92rem; font-weight: 600;
    }

    .expand-item-wrap { background: #faf7f2; border: 1px solid #ebd9c2; border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; }
    .expand-item-header { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.93rem; font-weight: 600; }
    .expand-desc-box { display: none; margin-top: 10px; padding-left: 24px; }
    .expand-desc-box input { background: #fff; border: 1px dashed var(--accent-skyblue); }

    .photo-grid-stream { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 12px; }
    .photo-thumb-wrap {
      border: 1px solid #dcd1c2; border-radius: 8px; padding: 5px; background: #fff; position: relative;
    }
    .photo-thumb-wrap img { width: 100%; height: 105px; object-fit: cover; border-radius: 6px; display: block; cursor: zoom-in; }
    .btn-photo-del {
      position: absolute; top: 8px; right: 8px; background: rgba(44, 37, 35, 0.75);
      color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 13px; cursor: pointer;
    }

    .action-panel { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
    .btn-act {
      flex: 1; min-width: 135px; padding: 12px 10px; border: none; border-radius: 10px;
      font-family: var(--font-serif-tc); font-size: 0.95rem; font-weight: 700; color: #fff; cursor: pointer; text-align: center;
    }
    .btn-save { background: var(--btn-green); }
    .btn-sync { background: var(--btn-blue); }
    .btn-danger-sm { background: var(--btn-danger); color: #fff; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; }

    .modal-backdrop {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(35, 28, 24, 0.65); backdrop-filter: blur(4px); z-index: 1000;
      justify-content: center; align-items: center; padding: 16px;
    }
    .modal {
      background: #fffdfa; border-radius: 18px; width: 100%; max-width: 720px; max-height: 90vh;
      overflow-y: auto; padding: 24px; border: 1px solid #ebd9c2;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

<div class="canvas-container">

  <div class="gallery-header">
    <div class="gallery-subtitle">Specific Soil and Water Conservation Zone Survey</div>
    <div class="gallery-title">保全對象現地訪談調查系統</div>
  </div>

  <div class="palette-nav">
    <button class="palette-tab-btn active" onclick="switchMainTab('surveyTab')">📝 訪談紀錄填報</button>
    <button class="palette-tab-btn" onclick="switchMainTab('adminTab')">🏛️ 訪談成果庫</button>
  </div>

  <!-- ================= 分頁 1：訪談紀錄填報 ================= -->
  <div id="surveyTab" class="tab-content active">

    <div class="pastel-ribbon">
      <span style="font-weight:700; color:#4a3e35; font-size:0.9rem;">
        📋 本機已訪談戶管理
      </span>
      <button type="button" class="btn-brush" onclick="openLocalListModal()">📋 開啟本機訪談清冊 (<span id="recordCountBadge">0</span>)</button>
    </div>

    <div style="display:flex; justify-content:space-between; font-size:0.84rem; color:var(--oil-muted); margin-bottom:12px;">
      <span id="saveStatus">💾 草稿已自動保存至本機</span>
      <span id="currentEditingIndicator" style="font-weight:bold; color:var(--accent-plum);">📝 填報新受訪對象</span>
    </div>

    <!-- 1. 基本資訊 -->
    <div class="panel-card">
      <div class="panel-title">
        <span>■ 受訪者基本資訊</span>
        <button type="button" class="btn-brush" onclick="fetchCurrentGPS()">📍 擷取訪談點 GPS</button>
      </div>

      <div class="row">
        <div class="col form-group">
          <label>專案名稱：</label>
          <input type="text" id="projectName" value="115年度臺中市和平區博愛里中-003、004特定水保區通盤檢討" class="survey-input">
        </div>
        <div class="col form-group">
          <label>特定區溪流：<span style="color:red;">*</span></label>
          <select id="streamName" class="survey-input">
            <option value="中-003（松鶴一溪）">中-003（松鶴一溪）</option>
            <option value="中-004（松鶴二溪）">中-004（松鶴二溪）</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col form-group">
          <label>受訪者姓名/商號：<span style="color:red;">*</span></label>
          <input type="text" id="interviewee" placeholder="例如：松鶴那一家、林先生" class="survey-input">
        </div>
        <div class="col form-group">
          <label>聯絡電話：</label>
          <input type="text" id="phone" placeholder="選填，電話或手機" class="survey-input">
        </div>
        <div class="col form-group">
          <label>訪談日期：<span style="color:red;">*</span></label>
          <input type="date" id="surveyDate" class="survey-input">
        </div>
      </div>

      <div class="row">
        <div class="col form-group">
          <label>訪談調查人員：<span style="color:red;">*</span></label>
          <input type="text" id="surveyor" placeholder="例如：梁閔智、邱渝方、工讀生" class="survey-input">
        </div>
        <div class="col form-group">
          <label>標的座落地號/門牌：</label>
          <input type="text" id="address" placeholder="例如：東關路一段松鶴二巷4-2號" class="survey-input">
        </div>
      </div>

      <div class="row">
        <div class="col form-group">
          <label>GPS 座標 X (經度)：</label>
          <input type="text" id="coordX" placeholder="X (E)" class="survey-input">
        </div>
        <div class="col form-group">
          <label>GPS 座標 Y (緯度)：</label>
          <input type="text" id="coordY" placeholder="Y (N)" class="survey-input">
        </div>
      </div>

      <div class="form-group">
        <label>土地權屬關係：</label>
        <div class="choice-grid">
          <label class="choice-item"><input type="radio" name="landRight" value="土地所有權人" class="survey-input"> 土地所有權人</label>
          <label class="choice-item"><input type="radio" name="landRight" value="合法承租人" class="survey-input"> 合法承租人</label>
          <label class="choice-item"><input type="radio" name="landRight" value="設籍現住戶" class="survey-input"> 設籍現住戶</label>
          <label class="choice-item"><input type="radio" name="landRight" value="其他" class="survey-input"> 其他權屬</label>
        </div>
        <input type="text" id="landRightNote" placeholder="權屬備註 (如：待確認、原住民保留地租賃)" style="margin-top:6px;" class="survey-input">
      </div>

      <div class="form-group">
        <label>保全對象類型：</label>
        <div class="choice-grid">
          <label class="choice-item"><input type="radio" name="targetType" value="住宅/聚落住戶" class="survey-input"> 住宅 / 聚落住戶</label>
          <label class="choice-item"><input type="radio" name="targetType" value="學校/公有建物" class="survey-input"> 學校 / 公有建物</label>
          <label class="choice-item"><input type="radio" name="targetType" value="交通道路/重要橋梁" class="survey-input"> 交通道路 / 重要橋梁</label>
          <label class="choice-item"><input type="radio" name="targetType" value="農業/觀光休閒設施" class="survey-input"> 農業 / 觀光休閒設施</label>
        </div>
        <input type="text" id="targetTypeNote" placeholder="類型備註說明" style="margin-top:6px;" class="survey-input">
      </div>

      <div class="row">
        <div class="col form-group">
          <label>居住/耕作年資：</label>
          <select id="seniority" class="survey-input">
            <option value="未滿 5 年">未滿 5 年</option>
            <option value="5～10 年">5～10 年</option>
            <option value="10～20 年">10～20 年</option>
            <option value="20 年以上">20 年以上</option>
          </select>
        </div>
        <div class="col form-group">
          <label>起算年份 (自民國幾年起居住)：</label>
          <input type="text" id="startYear" placeholder="例如：民國 75 年" class="survey-input">
        </div>
      </div>
    </div>

    <!-- 2. 歷史受災與現場衝擊 -->
    <div class="panel-card">
      <div class="panel-title">■ 歷史受災過程與受災陳述</div>

      <div class="form-group">
        <label>歷次重大災害經歷：</label>
        <div class="choice-grid">
          <label class="choice-item"><input type="checkbox" name="chk_disaster" value="88年 921地震" class="survey-input"> 88年 921地震</label>
          <label class="choice-item"><input type="checkbox" name="chk_disaster" value="90年 桃芝颱風" class="survey-input"> 90年 桃芝颱風</label>
          <label class="choice-item"><input type="checkbox" name="chk_disaster" value="93年 敏督利颱風(七二水災)" class="survey-input"> 93年 七二敏督利</label>
          <label class="choice-item"><input type="checkbox" name="chk_disaster" value="98年 莫拉克颱風" class="survey-input"> 98年 莫拉克颱風</label>
          <label class="choice-item"><input type="checkbox" name="chk_disaster" value="近年重大豪雨事件" class="survey-input"> 近年強降雨/豪雨</label>
          <label class="choice-item"><input type="checkbox" name="chk_disaster" value="從未經歷顯著災害" class="survey-input"> 從未經歷顯著災害</label>
        </div>
        <input type="text" id="disasterNote" placeholder="重大事件歷程補充" style="margin-top:6px;" class="survey-input">
      </div>

      <!-- 可點選展開的衝擊細項 -->
      <div class="form-group">
        <label>歷次受災情況與現場衝擊項目（點選展開詳細數據）：</label>
        <div class="expand-item-wrap">
          <label class="expand-item-header">
            <input type="checkbox" name="chk_impact" value="土砂溢淹與淤積" onchange="toggleDescBox(this, 'box_impact_sand')" class="survey-input">
            <span>1. 土砂溢淹與淤積狀況</span>
          </label>
          <div class="expand-desc-box" id="box_impact_sand">
            <input type="text" id="note_impact_sand" placeholder="描述：庭院泥流約__公分，或土石進室內__公尺 (無則填無)" class="survey-input">
          </div>
        </div>
        <div class="expand-item-wrap">
          <label class="expand-item-header">
            <input type="checkbox" name="chk_impact" value="邊坡位移與構造損壞" onchange="toggleDescBox(this, 'box_impact_slope')" class="survey-input">
            <span>2. 邊坡位移與構造損壞</span>
          </label>
          <div class="expand-desc-box" id="box_impact_slope">
            <input type="text" id="note_impact_slope" placeholder="描述：地表開裂、擋土牆受損位移、建物龜裂等" class="survey-input">
          </div>
        </div>
        <div class="expand-item-wrap">
          <label class="expand-item-header">
            <input type="checkbox" name="chk_impact" value="聯外交通與生活機能中斷" onchange="toggleDescBox(this, 'box_impact_life')" class="survey-input">
            <span>3. 聯外交通與生活機能影響</span>
          </label>
          <div class="expand-desc-box" id="box_impact_life">
            <input type="text" id="note_impact_life" placeholder="描述：道路中斷__天、水電中斷、曾配合撤離等" class="survey-input">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>居民口述受災詳細過程：</label>
        <textarea id="interviewDetail" rows="3" placeholder="詳細記錄受訪者陳述之土石流流向、崩塌發生的徵兆、近年溪流整治前後之變化感受..." class="survey-input"></textarea>
      </div>
    </div>

    <!-- 3. 設施成效評估 -->
    <div class="panel-card">
      <div class="panel-title">■ 既有水保與防砂設施成效評估 (受訪者感受)</div>
      <div class="form-group">
        <label>針對上游或周邊已完工水土保持與防砂工程（梳子壩、沉砂池、護岸等）：</label>
        <div style="display:flex; flex-direction:column; gap:8px; margin-top:6px;">
          <label class="choice-item">
            <input type="radio" name="engineeringFeedback" value="成效極為顯著，工程完工後歷次豪雨皆無再受災，安全感明顯提升" class="survey-input">
            <span><b>成效極為顯著：</b>工程完工後歷次豪雨皆無再受災，安全感明顯提升</span>
          </label>
          <label class="choice-item">
            <input type="radio" name="engineeringFeedback" value="稍有改善，但豪雨時局部斷面仍有漫淹或沖刷疑慮" class="survey-input">
            <span><b>稍有改善：</b>但豪雨時局部斷面仍有漫淹或沖刷疑慮</span>
          </label>
          <label class="choice-item">
            <input type="radio" name="engineeringFeedback" value="成效有限 / 設施有淤滿、局部損壞或清疏不及情形" class="survey-input">
            <span><b>成效有限：</b>設施有淤滿、局部損壞或清疏不及情形</span>
          </label>
          <label class="choice-item">
            <input type="radio" name="engineeringFeedback" value="周邊未見顯著整治工程 / 不清楚工程位置" class="survey-input">
            <span><b>不清楚／未見工程：</b>周邊未見顯著整治工程或不清楚位置</span>
          </label>
        </div>
      </div>
    </div>

    <!-- 4. 照片紀錄 -->
    <div class="panel-card">
      <div class="panel-title">■ 現場訪談與環境照片紀錄</div>
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
        <span style="font-size:0.9rem; color:var(--oil-muted);">拍照記錄（現訪合影、標的物外觀、周邊溪溝）</span>
        <div>
          <button type="button" class="btn-brush" onclick="document.getElementById('camInput').click()">📷 手機拍照</button>
          <button type="button" class="btn-brush" onclick="document.getElementById('albumInput').click()">🖼️ 相簿選取</button>
        </div>
      </div>
      <div class="photo-grid-stream" id="photoContainer"></div>
      <input type="file" id="camInput" accept="image/*" capture="environment" style="display:none;" onchange="handlePhotoUpload(this)">
      <input type="file" id="albumInput" accept="image/*" multiple style="display:none;" onchange="handlePhotoUpload(this)">
    </div>

    <!-- 操作按鈕 -->
    <div class="action-panel">
      <button type="button" class="btn-act btn-save" onclick="saveCurrentInterview()">💾 存檔並訪談下一戶</button>
      <button type="button" class="btn-act btn-sync" onclick="syncCurrentToCloud()">☁️ 同步本戶至雲端</button>
    </div>

  </div>

  <!-- ================= 分頁 2：訪談成果庫 ================= -->
  <div id="adminTab" class="tab-content">
    <div id="adminAuthBox" class="panel-card" style="max-width:440px; margin:40px auto; text-align:center;">
      <h3 style="margin-top:0;">🔒 管理員驗證</h3>
      <input type="password" id="adminPwdInput" placeholder="請輸入管理員密碼" style="text-align:center; font-size:1.1rem; letter-spacing:3px; margin-bottom:14px;">
      <button type="button" class="btn-act btn-save" style="width:100%;" onclick="verifyAdminPwd()">解鎖進入後台</button>
    </div>

    <div id="adminDashboard" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:8px;">
        <h2 style="font-size:1.25rem; margin:0;">📊 保全對象訪談成果總覽</h2>
        <div>
          <button type="button" class="btn-brush" onclick="fetchCloudData()">🔄 刷新雲端資料</button>
          <button type="button" class="btn-brush" style="background:#5c768d; color:#fff;" onclick="openChangePwdModal()">🔑 修改管理員密碼</button>
        </div>
      </div>

<div class="modal-backdrop" id="changePwdModal">
  <div class="modal" style="max-width:380px;">
    <h3 style="margin-top:0;">🔑 修改管理員密碼</h3>
    <div class="form-group">
      <label>請輸入新密碼：</label>
      <input type="text" id="newAdminPwd" placeholder="輸入自訂新密碼">
    </div>
    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
      <button type="button" class="btn-brush" onclick="closeChangePwdModal()">取消</button>
      <button type="button" class="btn-act btn-save" onclick="submitChangePwd()">確認更新</button>
    </div>
  </div>
</div>

<script>
  // 請填入您發布的 Google Web App URL
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyWkAQuKducGBfzemEEURSelshYngqnio9y5LsgApot6oyEnnYoGsX1qxhukOl0C384/exec";

  let photoList = [];
  let currentRecordId = null;
  let globalCloudRecords = [];
  let currentViewingRecord = null;

  const DB_NAME = "InterviewPhotoDB", DB_STORE = "records_photos";

  function openDB() {
    return new Promise((resolve) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore(DB_STORE, { keyPath: "recordId" });
      req.onsuccess = () => resolve(req.result);
    });
  }

  async function savePhotosToDB(recordId, photos) {
    if (!recordId) return;
    try {
      const db = await openDB();
      const tx = db.transaction(DB_STORE, "readwrite");
      tx.objectStore(DB_STORE).put({ recordId: recordId, photos: photos });
    } catch(e){}
  }

  async function getPhotosFromDB(recordId) {
    if (!recordId) return [];
    return new Promise(async (resolve) => {
      try {
        const db = await openDB();
        const tx = db.transaction(DB_STORE, "readonly");
        const req = tx.objectStore(DB_STORE).get(recordId);
        req.onsuccess = () => resolve(req.result ? req.result.photos : []);
        req.onerror = () => resolve([]);
      } catch(e) { resolve([]); }
    });
  }

  async function deletePhotosFromDB(recordId) {
    if (!recordId) return;
    try {
      const db = await openDB();
      const tx = db.transaction(DB_STORE, "readwrite");
      tx.objectStore(DB_STORE).delete(recordId);
    } catch(e){}
  }

  function toggleDescBox(chk, boxId) {
    const box = document.getElementById(boxId);
    if (box) box.style.display = chk.checked ? "block" : "none";
    autoSaveDraft();
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("surveyDate").value = new Date().toISOString().split('T')[0];
    updateLocalCountBadge();
    const draftId = localStorage.getItem("CURRENT_INTV_ID");
    if (draftId) loadLocalRecord(draftId, false);

    // 【重要修復】只有填報區的表單欄位才會觸發 autoSaveDraft，後台與密碼框完全排除！
    document.querySelectorAll(".survey-input").forEach(el => {
      el.addEventListener("input", autoSaveDraft);
      el.addEventListener("change", autoSaveDraft);
    });
  });

  function switchMainTab(tabId) {
    document.querySelectorAll(".palette-tab-btn").forEach((btn, idx) => {
      btn.classList.toggle("active", (idx === 0 && tabId === "surveyTab") || (idx === 1 && tabId === "adminTab"));
    });
    document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
    document.getElementById(tabId).classList.add("active");
  }

  // ================= 密碼驗證 (與 Google Sheets 雲端連動) =================
  async function verifyAdminPwd() {
    const pwdInput = document.getElementById("adminPwdInput").value.trim();
    if (!pwdInput) return alert("請輸入密碼！");

    try {
      const res = await fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "VERIFY_ADMIN_PWD", password: pwdInput })
      });
      const data = await res.json();
      if (data.status === "success") {
        document.getElementById("adminAuthBox").style.display = "none";
        document.getElementById("adminDashboard").style.display = "block";
        fetchCloudData();
      } else {
        alert("密碼錯誤，請重新輸入！");
      }
    } catch (e) {
      alert("驗證連線失敗，請檢查網路或 API 網址設定！");
    }
  }

  function openChangePwdModal() { document.getElementById("changePwdModal").style.display = "flex"; }
  function closeChangePwdModal() { document.getElementById("changePwdModal").style.display = "none"; }

  async function submitChangePwd() {
    const newPwd = document.getElementById("newAdminPwd").value.trim();
    if (!newPwd) return alert("請輸入新密碼！");

    try {
      const res = await fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "UPDATE_ADMIN_PWD", newPassword: newPwd })
      });
      const data = await res.json();
      if (data.status === "success") {
        alert("✅ 管理員密碼已成功更新至 Google Sheets 試算表！");
        closeChangePwdModal();
      } else {
        alert("更新失敗：" + data.message);
      }
    } catch(e) {
      alert("連線更新失敗：" + e.message);
    }
  }

  // 【關鍵防呆】：受訪者姓名空白時，絕不自動建立任何草稿 ID！
  function autoSaveDraft() {
    const name = document.getElementById("interviewee").value.trim();
    if (!name) return; // 沒填姓名，直接退出，不產生任何幽靈草稿

    if (!currentRecordId) currentRecordId = "INTV_" + Date.now();
    const data = collectFormData(currentRecordId);
    localStorage.setItem("INTV_DRAFT_" + currentRecordId, JSON.stringify(data));
    savePhotosToDB(currentRecordId, photoList);
    document.getElementById("saveStatus").innerText = `💾 草稿已於 ${new Date().toLocaleTimeString()} 暫存`;
  }

  function collectFormData(recordId) {
    const impactArr = Array.from(document.querySelectorAll("input[name='chk_impact']:checked")).map(el => {
      let val = el.value;
      if (val === "土砂溢淹與淤積" && document.getElementById("note_impact_sand")?.value) val += `【${document.getElementById("note_impact_sand").value}】`;
      if (val === "邊坡位移與構造損壞" && document.getElementById("note_impact_slope")?.value) val += `【${document.getElementById("note_impact_slope").value}】`;
      if (val === "聯外交通與生活機能中斷" && document.getElementById("note_impact_life")?.value) val += `【${document.getElementById("note_impact_life").value}】`;
      return val;
    });

    return {
      id: recordId,
      projectName: document.getElementById("projectName").value,
      streamName: document.getElementById("streamName").value,
      surveyDate: document.getElementById("surveyDate").value,
      surveyor: document.getElementById("surveyor").value,
      interviewee: document.getElementById("interviewee").value.trim(),
      phone: document.getElementById("phone").value,
      address: document.getElementById("address").value,
      coordX: document.getElementById("coordX").value,
      coordY: document.getElementById("coordY").value,
      landRight: document.querySelector("input[name='landRight']:checked")?.value || "",
      landRightNote: document.getElementById("landRightNote").value,
      targetType: document.querySelector("input[name='targetType']:checked")?.value || "",
      targetTypeNote: document.getElementById("targetTypeNote").value,
      seniority: document.getElementById("seniority").value,
      startYear: document.getElementById("startYear").value,
      disasterHistory: Array.from(document.querySelectorAll("input[name='chk_disaster']:checked")).map(e => e.value).join("；"),
      disasterNote: document.getElementById("disasterNote").value,
      impactSummary: impactArr.join("；"),
      interviewDetail: document.getElementById("interviewDetail").value,
      engineeringFeedback: document.querySelector("input[name='engineeringFeedback']:checked")?.value || "",
      notes: {
        sand: document.getElementById("note_impact_sand")?.value || "",
        slope: document.getElementById("note_impact_slope")?.value || "",
        life: document.getElementById("note_impact_life")?.value || ""
      }
    };
  }

  function saveCurrentInterview() {
    const name = document.getElementById("interviewee").value.trim();
    if (!name) return alert("⚠️ 請務必填寫「受訪者姓名/商號」再存檔！");

    if (!currentRecordId) currentRecordId = "INTV_" + Date.now();
    const data = collectFormData(currentRecordId);

    let all = JSON.parse(localStorage.getItem("ALL_INTERVIEW_RECORDS") || "[]");
    const idx = all.findIndex(r => r.id === currentRecordId);
    if (idx >= 0) all[idx] = data; else all.push(data);

    all = all.filter(r => r.interviewee && r.interviewee.trim() !== "");
    localStorage.setItem("ALL_INTERVIEW_RECORDS", JSON.stringify(all));
    savePhotosToDB(currentRecordId, photoList);

    alert(`✅ 已儲存「${data.interviewee}」訪談紀錄！切換至空白頁供填寫下一戶。`);
    startNewBlankRecord();
  }

  function startNewBlankRecord() {
    currentRecordId = null; // 重設為 null，避免空白表單帶有 ID
    localStorage.removeItem("CURRENT_INTV_ID");

    document.getElementById("interviewee").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("address").value = "";
    document.getElementById("coordX").value = "";
    document.getElementById("coordY").value = "";
    document.getElementById("landRightNote").value = "";
    document.getElementById("targetTypeNote").value = "";
    document.getElementById("startYear").value = "";
    document.getElementById("disasterNote").value = "";
    document.getElementById("interviewDetail").value = "";

    document.querySelectorAll("input[type='radio'], input[type='checkbox']").forEach(e => e.checked = false);
    
    ["note_impact_sand", "note_impact_slope", "note_impact_life"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = "";
    });
    ["box_impact_sand", "box_impact_slope", "box_impact_life"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = "none";
    });

    photoList = [];
    renderPhotos();
    document.getElementById("currentEditingIndicator").innerText = "📝 填報新受訪對象";
    document.getElementById("saveStatus").innerText = "💾 草稿已自動保存至本機";
    updateLocalCountBadge();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function loadLocalRecord(recordId, shouldCloseModal = true) {
    let all = JSON.parse(localStorage.getItem("ALL_INTERVIEW_RECORDS") || "[]");
    let record = all.find(r => r.id === recordId);
    if (!record) {
      const draft = localStorage.getItem("INTV_DRAFT_" + recordId);
      if (draft) record = JSON.parse(draft);
    }
    if (!record || !record.interviewee) return;

    currentRecordId = record.id;
    localStorage.setItem("CURRENT_INTV_ID", currentRecordId);

    document.getElementById("projectName").value = record.projectName || "";
    document.getElementById("streamName").value = record.streamName || "中-003（松鶴一溪）";
    document.getElementById("surveyDate").value = record.surveyDate || "";
    document.getElementById("surveyor").value = record.surveyor || "";
    document.getElementById("interviewee").value = record.interviewee || "";
    document.getElementById("phone").value = record.phone || "";
    document.getElementById("address").value = record.address || "";
    document.getElementById("coordX").value = record.coordX || "";
    document.getElementById("coordY").value = record.coordY || "";
    document.getElementById("landRightNote").value = record.landRightNote || "";
    document.getElementById("targetTypeNote").value = record.targetTypeNote || "";
    document.getElementById("seniority").value = record.seniority || "20 年以上";
    document.getElementById("startYear").value = record.startYear || "";
    document.getElementById("disasterNote").value = record.disasterNote || "";
    document.getElementById("interviewDetail").value = record.interviewDetail || "";

    if (record.landRight) {
      const rad = document.querySelector(`input[name='landRight'][value='${record.landRight}']`);
      if (rad) rad.checked = true;
    }
    if (record.targetType) {
      const rad = document.querySelector(`input[name='targetType'][value='${record.targetType}']`);
      if (rad) rad.checked = true;
    }

    if (record.engineeringFeedback) {
      const efRad = document.querySelector(`input[name='engineeringFeedback'][value='${record.engineeringFeedback}']`);
      if (efRad) efRad.checked = true;
    }

    document.querySelectorAll("input[name='chk_disaster']").forEach(e => e.checked = false);
    (record.disasterHistory || "").split("；").forEach(val => {
      const chk = document.querySelector(`input[name='chk_disaster'][value='${val}']`);
      if (chk) chk.checked = true;
    });

    document.querySelectorAll("input[name='chk_impact']").forEach(e => e.checked = false);
    ["box_impact_sand", "box_impact_slope", "box_impact_life"].forEach(id => document.getElementById(id).style.display = "none");
    
    if (record.notes) {
      if (document.getElementById("note_impact_sand")) document.getElementById("note_impact_sand").value = record.notes.sand || "";
      if (document.getElementById("note_impact_slope")) document.getElementById("note_impact_slope").value = record.notes.slope || "";
      if (document.getElementById("note_impact_life")) document.getElementById("note_impact_life").value = record.notes.life || "";
    }

    (record.impactSummary || "").split("；").forEach(item => {
      if (item.includes("土砂溢淹與淤積")) {
        const chk = document.querySelector("input[name='chk_impact'][value='土砂溢淹與淤積']");
        if (chk) { chk.checked = true; document.getElementById("box_impact_sand").style.display = "block"; }
      }
      if (item.includes("邊坡位移與構造損壞")) {
        const chk = document.querySelector("input[name='chk_impact'][value='邊坡位移與構造損壞']");
        if (chk) { chk.checked = true; document.getElementById("box_impact_slope").style.display = "block"; }
      }
      if (item.includes("聯外交通與生活機能中斷")) {
        const chk = document.querySelector("input[name='chk_impact'][value='聯外交通與生活機能中斷']");
        if (chk) { chk.checked = true; document.getElementById("box_impact_life").style.display = "block"; }
      }
    });

    photoList = await getPhotosFromDB(record.id);
    renderPhotos();

    document.getElementById("currentEditingIndicator").innerText = `🔍 正在回溯修改：【${record.interviewee}】`;
    if (shouldCloseModal) closeLocalListModal();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function deleteLocalRecord(recordId, name) {
    if (!confirm(`⚠️ 確定要刪除「${name}」的訪談資料嗎？\n刪除後此筆紀錄與其照片將自本機永久移除！`)) return;

    let all = JSON.parse(localStorage.getItem("ALL_INTERVIEW_RECORDS") || "[]");
    all = all.filter(r => r.id !== recordId);
    localStorage.setItem("ALL_INTERVIEW_RECORDS", JSON.stringify(all));

    localStorage.removeItem("INTV_DRAFT_" + recordId);
    await deletePhotosFromDB(recordId);

    if (currentRecordId === recordId) {
      startNewBlankRecord();
    }

    updateLocalCountBadge();
    renderLocalList();
    alert(`已成功刪除「${name}」！`);
  }

  function openLocalListModal() { renderLocalList(); document.getElementById("localListModal").style.display = "flex"; }
  function closeLocalListModal() { document.getElementById("localListModal").style.display = "none"; }

  function renderLocalList() {
    const container = document.getElementById("localRecordsList");
    container.innerHTML = "";
    let all = JSON.parse(localStorage.getItem("ALL_INTERVIEW_RECORDS") || "[]");
    all = all.filter(r => r.interviewee && r.interviewee.trim() !== "");
    if (!all.length) {
      container.innerHTML = "<p style='text-align:center; color:#888;'>本機尚無暫存訪談紀錄</p>";
      return;
    }
    all.forEach((rec, idx) => {
      const div = document.createElement("div");
      div.className = "panel-card";
      div.style.cssText = "padding:10px; margin-bottom:8px;";
      div.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <b>${idx+1}. ${rec.interviewee}</b> (${rec.streamName})
            <br><small style="color:var(--oil-muted);">門牌: ${rec.address || "-"} | 日期: ${rec.surveyDate}</small>
          </div>
          <div style="display:flex; gap:6px;">
            <button type="button" class="btn-brush" onclick="loadLocalRecord('${rec.id}')">載入回溯</button>
            <button type="button" class="btn-danger-sm" onclick="deleteLocalRecord('${rec.id}', '${rec.interviewee}')">🗑️ 刪除</button>
          </div>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function updateLocalCountBadge() {
    let all = JSON.parse(localStorage.getItem("ALL_INTERVIEW_RECORDS") || "[]");
    all = all.filter(r => r.interviewee && r.interviewee.trim() !== "");
    document.getElementById("recordCountBadge").innerText = all.length;
  }

  function handlePhotoUpload(input) {
    Array.from(input.files).forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const MAX_WIDTH = 1200;
          let w = img.width, h = img.height;
          if (w > MAX_WIDTH) { h = Math.round((h * MAX_WIDTH) / w); w = MAX_WIDTH; }
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          photoList.push({ id: Date.now() + "_" + Math.random().toString(36).substr(2, 4), base64: canvas.toDataURL("image/jpeg", 0.75) });
          renderPhotos();
          autoSaveDraft();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
    input.value = "";
  }

  function renderPhotos() {
    const container = document.getElementById("photoContainer");
    container.innerHTML = "";
    photoList.forEach((p, idx) => {
      const div = document.createElement("div");
      div.className = "photo-thumb-wrap";
      div.innerHTML = `
        <button type="button" class="btn-photo-del" onclick="photoList.splice(${idx}, 1); renderPhotos(); autoSaveDraft();">×</button>
        <img src="${p.base64}">
      `;
      container.appendChild(div);
    });
  }

  function fetchCurrentGPS() {
    if (!navigator.geolocation) return alert("不支援 GPS");
    navigator.geolocation.getCurrentPosition(pos => {
      document.getElementById("coordX").value = pos.coords.longitude.toFixed(6);
      document.getElementById("coordY").value = pos.coords.latitude.toFixed(6);
      autoSaveDraft();
      alert("GPS 定位成功！");
    }, err => alert("定位失敗: " + err.message));
  }

  // 同步本戶至雲端
  async function syncCurrentToCloud() {
    const name = document.getElementById("interviewee").value.trim();
    if (!name) return alert("⚠️ 同步失敗：受訪者姓名/商號為必填項，請填寫後再同步！");

    if (!currentRecordId) currentRecordId = "INTV_" + Date.now();
    const data = collectFormData(currentRecordId);
    data.photos = photoList;

    try {
      const res = await fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      if (result.status === "success") {
        alert(`🎉 恭喜！「${data.interviewee}」訪談紀錄已同步至 Google 雲端！`);
      } else {
        alert("同步出錯：" + result.message);
      }
    } catch(e) { alert("同步失敗: " + e.message); }
  }

  // 一鍵同步全部本機
  async function syncAllLocalToCloud() {
    let all = JSON.parse(localStorage.getItem("ALL_INTERVIEW_RECORDS") || "[]");
    all = all.filter(r => r.interviewee && r.interviewee.trim() !== "");

    if (!all.length) return alert("⚠️ 本機無有效訪談紀錄可供同步！");
    if (!confirm(`確定將本機共 ${all.length} 戶有效訪談資料同步至雲端嗎？`)) return;

    let successCount = 0;
    for (let r of all) {
      r.photos = await getPhotosFromDB(r.id);
      try {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(r)
        });
        const json = await res.json();
        if (json.status === "success") successCount++;
      } catch(e){}
    }
    alert(`🎉 同步完成！共成功同步 ${successCount} 戶訪談資料！`);
    closeLocalListModal();
  }

  // 刷新雲端資料
  async function fetchCloudData() {
    const container = document.getElementById("cloudRecordsContainer");
    container.innerHTML = "<p style='text-align:center;'>正在抓取雲端訪談紀錄...</p>";
    try {
      const res = await fetch(GAS_API_URL);
      const result = await res.json();
      const list = result.records || [];
      globalCloudRecords = list.filter(r => r.interviewee && r.interviewee.trim() !== "");
      renderCloudDashboard();
    } catch(e) {
      let localAll = JSON.parse(localStorage.getItem("ALL_INTERVIEW_RECORDS") || "[]");
      globalCloudRecords = localAll.filter(r => r.interviewee && r.interviewee.trim() !== "");
      renderCloudDashboard();
    }
  }

  function renderCloudDashboard() {
    globalCloudRecords = globalCloudRecords.filter(r => r.interviewee && r.interviewee.trim() !== "");

    document.getElementById("statTotalCount").innerText = globalCloudRecords.length;
    document.getElementById("stat003Count").innerText = globalCloudRecords.filter(r => (r.streamName || "").includes("中-003")).length;
    document.getElementById("stat004Count").innerText = globalCloudRecords.filter(r => (r.streamName || "").includes("中-004")).length;

    const container = document.getElementById("cloudRecordsContainer");
    container.innerHTML = "";
    if (!globalCloudRecords.length) {
      container.innerHTML = "<p style='text-align:center; color:#888;'>尚無有效雲端訪談資料</p>";
      return;
    }

    globalCloudRecords.forEach((r, idx) => {
      const div = document.createElement("div");
      div.className = "panel-card";
      div.style.cssText = "padding:12px; margin-bottom:10px;";
      div.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #ede4d6; padding-bottom:6px;">
          <div>
            <b>${idx+1}. ${r.interviewee}</b> (${r.streamName || "未指定溪流"})
            <span style="font-size:0.8rem; background:#eee; padding:2px 6px; border-radius:4px; margin-left:6px;">${r.targetType || "住戶"}</span>
          </div>
          <div style="display:flex; gap:6px;">
            <button type="button" class="btn-brush" onclick="viewDetailCard('${r.id}')">🔍 查看詳細訪談卡</button>
            <button type="button" class="btn-brush" style="background:#557862; color:#fff;" onclick="openEditModal('${r.id}')">✏️ 修改內容</button>
          </div>
        </div>
        <div style="font-size:0.88rem; color:#5c4f44; margin-top:6px;">
          <span><b>電話：</b>${r.phone || "-"}</span> | 
          <span><b>門牌：</b>${r.address || "-"}</span> | 
          <span><b>訪談員：</b>${r.surveyor || "-"}</span> | 
          <span><b>日期：</b>${r.surveyDate || "-"}</span>
          <br><small style="color:#786d63;">歷次災害: ${r.disasterHistory || "無"} | 權屬: ${r.landRight || "未填"}</small>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function openEditModal(recordId) {
    const r = globalCloudRecords.find(x => String(x.id).trim() === String(recordId).trim());
    if (!r) return;
    document.getElementById("edit_id").value = r.id;
    document.getElementById("edit_interviewee").value = r.interviewee || "";
    document.getElementById("edit_phone").value = r.phone || "";
    document.getElementById("edit_surveyDate").value = r.surveyDate || "";
    document.getElementById("edit_surveyor").value = r.surveyor || "";
    document.getElementById("edit_address").value = r.address || "";
    document.getElementById("edit_landRight").value = r.landRight || "其他";
    document.getElementById("edit_landRightNote").value = r.landRightNote || "";
    document.getElementById("edit_targetType").value = r.targetType || "住宅/聚落住戶";
    document.getElementById("edit_startYear").value = r.startYear || "";
    document.getElementById("edit_impactSummary").value = r.impactSummary || "";
    document.getElementById("edit_interviewDetail").value = r.interviewDetail || "";
    document.getElementById("edit_engineeringFeedback").value = r.engineeringFeedback || "成效極為顯著，工程完工後歷次豪雨皆無再受災，安全感明顯提升";
    document.getElementById("editModal").style.display = "flex";
  }

  function closeEditModal() { document.getElementById("editModal").style.display = "none"; }

  async function saveEditedRecordToCloud() {
    const id = document.getElementById("edit_id").value;
    const r = globalCloudRecords.find(x => String(x.id).trim() === String(id).trim());
    if (!r) return;

    r.interviewee = document.getElementById("edit_interviewee").value.trim();
    if (!r.interviewee) return alert("受訪者姓名不能為空！");

    r.phone = document.getElementById("edit_phone").value;
    r.surveyDate = document.getElementById("edit_surveyDate").value;
    r.surveyor = document.getElementById("edit_surveyor").value;
    r.address = document.getElementById("edit_address").value;
    r.landRight = document.getElementById("edit_landRight").value;
    r.landRightNote = document.getElementById("edit_landRightNote").value;
    r.targetType = document.getElementById("edit_targetType").value;
    r.startYear = document.getElementById("edit_startYear").value;
    r.impactSummary = document.getElementById("edit_impactSummary").value;
    r.interviewDetail = document.getElementById("edit_interviewDetail").value;
    r.engineeringFeedback = document.getElementById("edit_engineeringFeedback").value;

    try {
      const res = await fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(r)
      });
      const result = await res.json();
      if (result.status === "success") {
        alert(`✅ 已成功更新「${r.interviewee}」的訪談內容並同步至 Google 試算表！`);
        closeEditModal();
        renderCloudDashboard();
      } else {
        alert("更新出錯：" + result.message);
      }
    } catch(e) {
      alert("更新失敗: " + e.message);
    }
  }

  async function viewDetailCard(recordId) {
    let r = globalCloudRecords.find(x => String(x.id).trim() === String(recordId).trim());
    if (!r) return;
    currentViewingRecord = r;

    document.getElementById("detailModalTitle").innerText = `📄 ${r.interviewee} 現地訪談調查表`;
    let photos = r.photos;
    if (!photos || (Array.isArray(photos) && !photos.length)) {
      photos = await getPhotosFromDB(r.id);
      r.photos = photos;
    }

    let pHTML = "";
    (Array.isArray(photos) ? photos : Object.values(photos)).forEach(p => {
      pHTML += `<div style="border:1px solid #ddd; padding:4px; border-radius:6px;"><img src="${p.base64}" style="width:100%; height:120px; object-fit:cover; border-radius:4px;"></div>`;
    });

    document.getElementById("detailModalBody").innerHTML = `
      <table style="width:100%; border-collapse:collapse; font-size:0.92rem; margin-bottom:12px;">
        <tr><td style="padding:6px; border:1px solid #ddd; background:#f4f1eb; width:25%;"><b>受訪者姓名</b></td><td style="padding:6px; border:1px solid #ddd;">${r.interviewee}</td><td style="padding:6px; border:1px solid #ddd; background:#f4f1eb; width:25%;"><b>聯絡電話</b></td><td style="padding:6px; border:1px solid #ddd;">${r.phone || "-"}</td></tr>
        <tr><td style="padding:6px; border:1px solid #ddd; background:#f4f1eb;"><b>調查溪流</b></td><td style="padding:6px; border:1px solid #ddd;">${r.streamName}</td><td style="padding:6px; border:1px solid #ddd; background:#f4f1eb;"><b>調查日期</b></td><td style="padding:6px; border:1px solid #ddd;">${r.surveyDate}</td></tr>
        <tr><td style="padding:6px; border:1px solid #ddd; background:#f4f1eb;"><b>訪談人員</b></td><td style="padding:6px; border:1px solid #ddd;">${r.surveyor}</td><td style="padding:6px; border:1px solid #ddd; background:#f4f1eb;"><b>居住/耕作年資</b></td><td style="padding:6px; border:1px solid #ddd;">${r.seniority} (${r.startYear || "-"})</td></tr>
        <tr><td style="padding:6px; border:1px solid #ddd; background:#f4f1eb;"><b>座落地號門牌</b></td><td colspan="3" style="padding:6px; border:1px solid #ddd;">${r.address || "-"}</td></tr>
        <tr><td style="padding:6px; border:1px solid #ddd; background:#f4f1eb;"><b>土地權屬關係</b></td><td colspan="3" style="padding:6px; border:1px solid #ddd;">${r.landRight} (${r.landRightNote || "-"})</td></tr>
        <tr><td style="padding:6px; border:1px solid #ddd; background:#f4f1eb;"><b>保全對象類型</b></td><td colspan="3" style="padding:6px; border:1px solid #ddd;">${r.targetType} (${r.targetTypeNote || "-"})</td></tr>
        <tr><td style="padding:6px; border:1px solid #ddd; background:#f4f1eb;"><b>歷次重大災害</b></td><td colspan="3" style="padding:6px; border:1px solid #ddd;">${r.disasterHistory || "無"} (${r.disasterNote || ""})</td></tr>
        <tr><td style="padding:6px; border:1px solid #ddd; background:#f4f1eb;"><b>現場受災衝擊</b></td><td colspan="3" style="padding:6px; border:1px solid #ddd;">${r.impactSummary || "無"}</td></tr>
        <tr><td style="padding:6px; border:1px solid #ddd; background:#f4f1eb;"><b>口述受災詳細</b></td><td colspan="3" style="padding:6px; border:1px solid #ddd;">${r.interviewDetail || "無"}</td></tr>
        <tr><td style="padding:6px; border:1px solid #ddd; background:#f4f1eb;"><b>既有水保工程成效評估</b></td><td colspan="3" style="padding:6px; border:1px solid #ddd;">${r.engineeringFeedback || "未填寫"}</td></tr>
      </table>
      <b>📸 現場訪談照片：</b>
      <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:8px; margin-top:6px;">
        ${pHTML || "<p style='color:#888;'>（無照片）</p>"}
      </div>
    `;
    document.getElementById("detailModal").style.display = "flex";
  }

  function closeDetailModal() { document.getElementById("detailModal").style.display = "none"; }

  function downloadInterviewWord() {
    if (!currentViewingRecord) return alert("查無當前訪談資料！");
    const r = currentViewingRecord;

    let pImgs = "";
    let photos = r.photos;
    if (photos) {
      (Array.isArray(photos) ? photos : Object.values(photos)).forEach(p => {
        pImgs += `<img src="${p.base64}" width="280" style="margin:6px; border:1px solid #999;">`;
      });
    }

    const docContent = `
      <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
      <head><meta charset='utf-8'><title>${r.interviewee} 訪談調查表</title>
      <style>
        body { font-family: "標楷體", "Times New Roman", serif; font-size: 12pt; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid black; padding: 6px 8px; font-size: 11pt; }
        th { background-color: #f2f2f2; text-align: center; }
      </style>
      </head>
      <body>
        <h2 style="text-align:center; font-family:'標楷體'; margin-bottom:2px;">特定水土保持區檢討作業—保全對象現地訪談調查表</h2>
        <p style="text-align:center; font-size:10.5pt; margin-top:0;">計畫名稱：${r.projectName}</p>
        <table>
          <tr><th width="20%">專案名稱</th><td width="30%">${r.projectName}</td><th width="20%">調查日期</th><td width="30%">${r.surveyDate}</td></tr>
          <tr><th>受訪者姓名</th><td>${r.interviewee}</td><th>聯絡電話</th><td>${r.phone || "-"}</td></tr>
          <tr><th>標的物座落地</th><td colspan="3">${r.address || "-"}</td></tr>
          <tr><th>特定區溪流</th><td>${r.streamName}</td><th>訪談調查人員</th><td>${r.surveyor}</td></tr>
          <tr><th>土地權屬關係</th><td colspan="3">${r.landRight} ${r.landRightNote ? "("+r.landRightNote+")" : ""}</td></tr>
          <tr><th>保全對象類型</th><td colspan="3">${r.targetType} ${r.targetTypeNote ? "("+r.targetTypeNote+")" : ""}</td></tr>
          <tr><th>居住/耕作年資</th><td colspan="3">${r.seniority} (自民國 ${r.startYear || "__"} 年起居住)</td></tr>
          <tr><th>經歷重大災害</th><td colspan="3">${r.disasterHistory || "無"} ${r.disasterNote ? "("+r.disasterNote+")" : ""}</td></tr>
          <tr><th>現場受災衝擊</th><td colspan="3">${r.impactSummary || "無"}</td></tr>
          <tr><th>受災詳細過程</th><td colspan="3">${r.interviewDetail || "無"}</td></tr>
          <tr><th>設施成效評估</th><td colspan="3">${r.engineeringFeedback || "未填寫"}</td></tr>
          <tr><th>GPS 座標</th><td colspan="3">X (經度): ${r.coordX || "-"} , Y (緯度): ${r.coordY || "-"}</td></tr>
        </table>
        <h3 style="font-family:'標楷體'; margin-top:16px;">訪談現場照片記錄：</h3>
        <div>${pImgs || "<p>（無照片）</p>"}</div>
      </body>
      </html>
    `;

    const blob = new Blob(['\ufeff' + docContent], { type: 'application/msword;charset=utf-8' });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `附件六_保全對象訪談紀錄表_${r.streamName}_${r.interviewee}.doc`;
    a.click();
  }
</script>
</body>
